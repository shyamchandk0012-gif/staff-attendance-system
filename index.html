<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Attendance</title>
<style>
body{font:16px system-ui;margin:0;background:#f3f6fb;color:#172033}.top{background:#172b4d;color:white;padding:20px 5%}.wrap{max-width:1000px;margin:25px auto;padding:0 15px}.card{background:white;border:1px solid #dde5ef;border-radius:14px;padding:20px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 5px}input{box-sizing:border-box;width:100%;padding:11px;border:1px solid #bbc7d8;border-radius:8px}button{padding:11px 15px;border:0;border-radius:8px;background:#245eea;color:white;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}.secondary{background:#e7edf7;color:#18345b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.hidden{display:none!important}.msg{padding:12px;background:#edf4ff;border-radius:8px;white-space:pre-wrap}.error{background:#fff0f0;color:#a11}.muted{color:#607089}.stat{font-size:1.5rem;font-weight:800}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:540px}td,th{text-align:left;padding:10px;border-bottom:1px solid #e6ebf2}th{background:#f7f9fc}
</style></head><body><header class="top"><b>Staff Attendance Register</b><span id="header" style="float:right"></span></header><main class="wrap">
<section id="login" class="card" style="max-width:440px;margin:45px auto"><h2>Sign in</h2><p class="muted">Use the login details given by your administrator.</p><form id="loginForm"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><p><button>Sign in</button></p></form><div id="loginMsg" class="msg hidden"></div></section>
<section id="app" class="hidden"><div id="msg" class="msg hidden"></div><div class="grid"><div class="card"><div class="muted">Employee</div><div class="stat" id="who">—</div><div id="role"></div></div><div class="card"><div class="muted">This month's hours</div><div class="stat" id="hours">0h 00m</div><div id="days" class="muted"></div></div></div>
<div class="card"><h2>My attendance</h2><button id="in">Check In</button><button id="out" class="secondary">Check Out</button><div class="tablewrap"><table><thead><tr><th>Date</th><th>In time</th><th>Out time</th><th>Duration</th></tr></thead><tbody id="mine"></tbody></table></div></div>
<section id="admin" class="hidden"><div class="card"><h2>Admin · Add employee</h2><p class="muted">Use an email for the login. Never reuse passwords.</p><form id="addForm" class="grid"><div><label>Employee name</label><input id="name" required></div><div><label>Username label</label><input id="username" required></div><div><label>Login email</label><input id="newEmail" type="email" required></div><div><label>Temporary password (6+ characters)</label><input id="newPassword" type="password" minlength="6" required></div><div><button>Create employee account</button></div></form></div>
<div class="card"><h2>All attendance</h2><label>Month</label><input id="month" type="month"><button id="refresh" class="secondary">Refresh</button><button id="csv" class="secondary">Export CSV</button><div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>In time</th><th>Out time</th><th>Duration</th></tr></thead><tbody id="all"></tbody></table></div></div></section>
<button id="signout" class="secondary">Sign out</button></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut,createUserWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,addDoc,getDocs,query,where,orderBy,serverTimestamp,updateDoc} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyAmXlL8piBVGJZ94XzILCLEJe0o6XME1N0",authDomain:"staff-attendance-system-8646c.firebaseapp.com",projectId:"staff-attendance-system-8646c",storageBucket:"staff-attendance-system-8646c.firebasestorage.app",messagingSenderId:"608838804280",appId:"1:608838804280:web:e4fb65aae0d8ade73ed7cd"};
const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),creator=initializeApp(cfg,"employeeCreator"),creatorAuth=getAuth(creator);
const $=x=>document.getElementById(x);let profile=null,mine=[],all=[],users=[];
const pad=n=>String(n).padStart(2,"0"),date=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,month=d=>date(d).slice(0,7);
const time=x=>x?new Date(x).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"—";
const ms=r=>r.checkOutAt?Math.max(0,new Date(r.checkOutAt)-new Date(r.checkInAt)):0;
const dur=n=>`${Math.floor(n/3600000)}h ${pad(Math.floor(n%3600000/60000))}m`;
function msg(t,err=false){$("msg").textContent=t;$("msg").className="msg"+(err?" error":"");$("msg").classList.remove("hidden")}
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("loginForm").onsubmit=async e=>{e.preventDefault();try{await signInWithEmailAndPassword(auth,$("email").value.trim(),$("password").value)}catch(x){$("loginMsg").textContent="Sign in failed. Check credentials and Authentication setup. "+x.code;$("loginMsg").classList.remove("hidden")}};
$("signout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,async u=>{if(!u){$("login").classList.remove("hidden");$("app").classList.add("hidden");$("header").textContent="";return}try{let s=await getDoc(doc(db,"users",u.uid));if(!s.exists()){await signOut(auth);$("loginMsg").textContent="Login exists but no user profile is assigned. Ask admin to complete setup.";$("loginMsg").classList.remove("hidden");return}profile={uid:u.uid,...s.data()};$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=profile.name;$("role").textContent=profile.role==="admin"?"Administrator":"Employee";$("header").textContent=profile.name;$("admin").classList.toggle("hidden",profile.role!=="admin");await loadMine();if(profile.role==="admin")await loadAll()}catch(e){msg("Could not load profile: "+e.message,true)}});
async function loadMine(){let q=query(collection(db,"attendance"),where("uid","==",auth.currentUser.uid),orderBy("date","desc"));mine=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));let m=month(new Date()),rs=mine.filter(r=>r.date?.startsWith(m));$("hours").textContent=dur(rs.reduce((a,r)=>a+ms(r),0));$("days").textContent=rs.length+" attendance records this month";let t=mine.find(r=>r.date===date(new Date()));$("in").disabled=!!t;$("out").disabled=!(t&&!t.checkOutAt);$("mine").innerHTML=mine.map(r=>`<tr><td>${safe(r.date)}</td><td>${time(r.checkInAt)}</td><td>${time(r.checkOutAt)}</td><td>${dur(ms(r))}</td></tr>`).join("")||'<tr><td colspan="4">No records yet.</td></tr>'}
$("in").onclick=async()=>{try{if(mine.some(r=>r.date===date(new Date())))return msg("You already have a record for today.",true);await addDoc(collection(db,"attendance"),{uid:auth.currentUser.uid,name:profile.name,username:profile.username||"",date:date(new Date()),checkInAt:new Date().toISOString(),checkOutAt:null,createdAt:serverTimestamp()});await loadMine();if(profile.role==="admin")await loadAll();msg("Check-in recorded.")}catch(e){msg("Check-in failed: "+e.message,true)}};
$("out").onclick=async()=>{try{let r=mine.find(r=>r.date===date(new Date()));if(!r||r.checkOutAt)return;await updateDoc(doc(db,"attendance",r.id),{checkOutAt:new Date().toISOString(),updatedAt:serverTimestamp()});await loadMine();if(profile.role==="admin")await loadAll();msg("Check-out recorded.")}catch(e){msg("Check-out failed: "+e.message,true)}};
$("addForm").onsubmit=async e=>{e.preventDefault();if(profile?.role!=="admin")return msg("Admin only.",true);try{let c=await createUserWithEmailAndPassword(creatorAuth,$("newEmail").value.trim(),$("newPassword").value);await setDoc(doc(db,"users",c.user.uid),{name:$("name").value.trim(),username:$("username").value.trim().toLowerCase(),email:$("newEmail").value.trim(),role:"employee",active:true,createdAt:serverTimestamp(),createdBy:auth.currentUser.uid});await signOut(creatorAuth);$("addForm").reset();msg("Employee account created. Share login details privately.");await loadAll()}catch(x){msg("Could not create account: "+x.message,true)}};
async function loadAll(){let a=await getDocs(query(collection(db,"attendance"),orderBy("date","desc")));all=a.docs.map(d=>({id:d.id,...d.data()}));let u=await getDocs(collection(db,"users"));users=u.docs.map(d=>({uid:d.id,...d.data()}));renderAll()}
function renderAll(){let m=$("month").value||month(new Date()),rs=all.filter(r=>r.date?.startsWith(m));$("all").innerHTML=rs.map(r=>`<tr><td>${safe(r.date)}</td><td>${safe(r.name)}</td><td>${time(r.checkInAt)}</td><td>${time(r.checkOutAt)}</td><td>${dur(ms(r))}</td></tr>`).join("")||'<tr><td colspan="5">No records for this month.</td></tr>'}
$("month").value=month(new Date());$("refresh").onclick=loadAll;$("month").onchange=renderAll;
$("csv").onclick=()=>{let m=$("month").value||month(new Date()),rs=all.filter(r=>r.date?.startsWith(m));let csv=[["Date","Employee","Username","In Time","Out Time","Duration"],...rs.map(r=>[r.date,r.name,r.username,time(r.checkInAt),time(r.checkOutAt),dur(ms(r))])].map(row=>row.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\r\n");let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="attendance-"+m+".csv";a.click();URL.revokeObjectURL(a.href)};
</script></body></html>
